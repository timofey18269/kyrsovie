<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Должности</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="content">

        <div th:replace="~{fragments/header :: header}"></div>

        <a th:href="@{/positions/create}"
           class="btn btn-add">
            Добавить запись
        </a>

        <br><br>

        <div class="table-container">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Оклад</th>
                    <th>Действия</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="position : ${positions}">

                    <td th:text="${position.positionId}"></td>

                    <td th:text="${position.name}"></td>

                    <td th:text="${position.salary}"></td>

                    <td>

                        <div class="actions">

                            <a class="btn btn-edit"
                               th:href="@{/positions/edit/{id}(id=${position.positionId})}">
                                Редактировать
                            </a>

                            <form class="delete-form"
                                  th:action="@{/positions/delete/{id}(id=${position.positionId})}"
                                  method="post"
                                  onsubmit="return confirm('Удалить запись?');">

                                <button
                                        class="btn btn-delete"
                                        type="submit">
                                    Удалить
                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
