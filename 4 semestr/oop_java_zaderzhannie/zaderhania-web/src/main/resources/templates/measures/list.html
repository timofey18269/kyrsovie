<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Меры</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="content">

        <div th:replace="~{fragments/header :: header}"></div>

        <a class="btn btn-add"
           th:href="@{/measures/create}">
            Добавить запись
        </a>

        <br><br>

        <div class="table-container">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Дело</th>
                    <th>Задержанный</th>
                    <th>Тип меры</th>
                    <th>Описание</th>
                    <th>Дата назначения</th>
                    <th>Действия</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="m : ${measures}">

                    <td th:text="${m.measureId}"></td>
                    <td th:text="${m.caseNumber}"></td>
                    <td th:text="${m.detaineeName}"></td>
                    <td th:text="${m.measureType}"></td>
                    <td th:text="${m.description}"></td>
                    <td th:text="${m.issuedAt}"></td>

                    <td>

                        <div class="actions">

                            <a class="btn btn-edit"
                               th:href="@{/measures/edit/{id}(id=${m.measureId})}">
                                Редактировать
                            </a>

                            <form class="delete-form"
                                  method="post"
                                  th:action="@{/measures/delete/{id}(id=${m.measureId})}">

                                <button class="btn btn-delete"
                                        type="submit">
                                    Удалить
                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
