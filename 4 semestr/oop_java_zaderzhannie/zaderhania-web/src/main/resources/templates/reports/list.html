<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Заявления о правонарушениях</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="content">

        <div th:replace="~{fragments/header :: header}"></div>

        <a th:href="@{/reports/create}"
           class="btn btn-add">
            Добавить запись
        </a>

        <br><br>

        <div class="table-container">

            <table>

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Номер заявления</th>
                    <th>Дата</th>
                    <th>Свидетель</th>
                    <th>Тип правонарушения</th>
                    <th>Место</th>
                    <th>Описание</th>
                    <th>Действия</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="r : ${reports}">

                    <td th:text="${r.reportId}"></td>

                    <td th:text="${r.reportNumber}"></td>

                    <td th:text="${#temporals.format(r.reportDate, 'dd.MM.yyyy HH:mm')}">
                    </td>

                    <td th:text="${r.witnessName}">
                    </td>

                    <td th:text="${r.offenseTypeName}">
                    </td>

                    <td th:text="${r.location}">
                    </td>

                    <td th:text="${r.description}">
                    </td>

                    <td>

                        <div class="actions">

                            <a class="btn btn-edit"
                               th:href="@{/reports/edit/{id}(id=${r.reportId})}">
                                Редактировать
                            </a>

                            <form class="delete-form"
                                  method="post"
                                  th:action="@{/reports/delete/{id}(id=${r.reportId})}">

                                <button
                                        type="submit"
                                        class="btn btn-delete">
                                    Удалить
                                </button>

                            </form>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
